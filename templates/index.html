<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastAPI Project</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">FastAPI App</a>
        </div>
    </nav>

    <!-- Hero Section -->
    <div class="container mt-5">
        <div class="p-5 bg-light rounded shadow-sm">
            <h1 class="display-4">Welcome to FastAPI</h1>
            <p class="lead">
                FastAPI with Bootstrap, Jinja2 Templates, Static Files, and PostgreSQL.
            </p>

            <a href="/docs" class="btn btn-primary">
                Open API Docs
            </a>
        </div>
    </div>

    <!-- Cards -->
    <div class="container mt-5">
        <div class="row">

            <div class="col-md-4">
                <div class="card shadow">
                    <div class="card-body">
                        <h5 class="card-title">FastAPI</h5>
                        <p class="card-text">
                            High-performance Python web framework.
                        </p>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card shadow">
                    <div class="card-body">
                        <h5 class="card-title">PostgreSQL</h5>
                        <p class="card-text">
                            Powerful open-source relational database.
                        </p>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card shadow">
                    <div class="card-body">
                        <h5 class="card-title">Bootstrap 5</h5>
                        <p class="card-text">
                            Responsive frontend framework.
                        </p>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
